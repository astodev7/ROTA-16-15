<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<body>

<header>

        <path d="M32 52 L44 64 L70 36"/>

      <span class="state-mono" id="stateLabel">PEDIDO ENVIADO</span>

      <p id="stateMessage">Consultando o status do seu pagamento…</p>
      <span class="order-ref" id="orderRef" hidden></span>
      <div class="state-actions">
        <a href="/" class="btn btn-solid">Voltar para a loja</a>
        <a href="https://www.instagram.com/rota1615.co/" target="_blank" rel="noopener noreferrer" class="btn btn-outline">Falar no Instagram</a>

  </section>

<footer>
  <div class="wrap footer-bottom" style="padding:24px 0;">
    <p>© 2026 ROTA 16:15 — TODOS OS DIREITOS RESERVADOS</p>
